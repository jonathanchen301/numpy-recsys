[project]
name = "rec-engine"
version = "0.1.0"
description = "From-scratch matrix factorization and SVD recommender engine in pure NumPy"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy (>=2.5.5,<3.0.0)", "pandas (>=3.1.1,<4.0.0)"]

[tool.poetry]
packages = [{ include = "rec_engine", from = "src" }]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "matplotlib (>=3.11.2,<4.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "jupyter (>=1.1.1,<2.0.0)"
]
